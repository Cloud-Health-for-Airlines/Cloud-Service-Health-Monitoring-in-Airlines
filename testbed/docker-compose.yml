services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: baccp
      POSTGRES_USER: baccp
      POSTGRES_PASSWORD: baccp-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baccp -d baccp"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - data-tier

  reservations:
    build: ./services/cloud-service
    environment:
      SERVICE_NAME: reservations
      SERVICE_PATH: /reservation
    ports:
      - "8081:8080"
    depends_on:
      - boundary-gateway
    networks:
      - cloud-tier

  crew:
    build: ./services/cloud-service
    environment:
      SERVICE_NAME: crew
      SERVICE_PATH: /crew
    ports:
      - "8082:8080"
    depends_on:
      - boundary-gateway
    networks:
      - cloud-tier

  baggage:
    build: ./services/cloud-service
    environment:
      SERVICE_NAME: baggage
      SERVICE_PATH: /baggage
    ports:
      - "8083:8080"
    depends_on:
      - boundary-gateway
    networks:
      - cloud-tier

  boundary-gateway:
    build: ./services/boundary-gateway
    ports:
      - "8084:8080"
    depends_on:
      - legacy-core
    networks:
      - cloud-tier
      - legacy-tier

  legacy-core:
    build: ./services/legacy-core
    networks:
      - legacy-tier

networks:
  cloud-tier:
  legacy-tier:
    internal: true

  data-tier:
    internal: true

volumes:
  postgres-data:
